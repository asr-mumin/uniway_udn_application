R.video=()=>`${bk('study')}<h1>Video Lessons</h1><input type="search" id="q" placeholder="Поиск по предметам" value="${S.vq}" oninput="S.vq=this.value;draw(1)">
${SUBJ.filter(s=>s[0].toLowerCase().includes(S.vq.toLowerCase())).map(s=>`<div class="card"><div class="row"><div class="ic">${s[1]}</div><div style="flex:1"><b>${s[0]}</b><div class="mu">Лекция 8 · 54 мин · проф. Нурланов</div></div></div>${bar(s[4])}<div class="row sp mu" style="margin-top:6px"><span>Просмотрено ${s[4]}%</span><span style="color:var(--pr);font-weight:700" onclick="toast('Закладка сохранена на 23:14')">🔖 Закладка</span></div></div>`).join('')}
<button class="btn alt" onclick="toast('Загрузка пропущенных лекций…')">Пропущенные темы (2)</button>`;
R.lib=()=>{const cats=['Все','IT','Математика','Физика','Языки','История','Литература'];
return `${bk('study')}<h1>Библиотека</h1><input type="search" id="q" placeholder="Название, автор, предмет" value="${S.q}" oninput="S.q=this.value;draw(1)"><div>${cats.map(c=>`<span class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';draw()">${c}</span>`).join('')}</div>
${BOOKS.map((b,i)=>({b,i})).filter(o=>(S.cat=='Все'||o.b[1]==S.cat)&&(o.b[0]+o.b[2]).toLowerCase().includes(S.q.toLowerCase())).map(o=>`<div class="card row"><div class="ic">📖</div><div style="flex:1"><b>${o.b[0]}</b><div class="mu">${o.b[2]} · ${o.b[1]}</div></div><button class="chip ${S.fav[o.i]?'on':''}" onclick="S.fav[${o.i}]=!S.fav[${o.i}];draw()">${S.fav[o.i]?'★':'☆'}</button><button class="chip" onclick="toast('Скачивание началось')">⬇</button></div>`).join('')}`};
R.grades=()=>`${bk('study')}<h1>My Grades</h1><div class="card hero" style="margin-top:10px"><div class="row sp"><div><div class="mu">Средний балл</div><h1 style="font-size:36px">3.7</h1></div><div style="text-align:right"><div class="mu">Рейтинг</div><h1>12 / 84</h1></div></div></div>
<div class="card"><div class="row sp"><b>Посещаемость</b><span class="g5">${Math.round((41+Object.keys(S.unl).length)/46*100)}%</span></div><div class="mu">Засчитывается после сканирования QR в аудитории</div>${LECT.map((l,i)=>`<div class="row sp" style="margin-top:8px"><span>${l[1]} · ${l[2]}</span><span class="${S.unl[i]?'g5':'mu'}">${S.unl[i]?'Присутствовал':'Не отмечен'}</span></div>`).join('')}</div>
<div class="card"><b>Прогноз стипендии</b><div class="mu">При текущих результатах: повышенная стипендия 45 000 ₸</div>${bar(82)}</div>
${SUBJ.map(s=>`<div class="card row"><div class="ic">${s[1]}</div><div style="flex:1"><b>${s[0]}</b><div class="mu">${s[5]} · ${s[2]} баллов</div></div><div class="g5" style="font-size:20px">${s[3]}</div></div>`).join('')}`;
R.wallet=()=>`<h1>Student Wallet</h1><div class="card hero" style="margin-top:12px"><div class="mu">Баланс</div><h1 style="font-size:34px">${fm(S.bal)} ₸</h1><div class="mu">Стипендия: 45 000 ₸ · 25 числа</div></div>
${S.tf=='paid'?`<div class="card" onclick="go('tuition')"><div class="row sp"><b>Оплата обучения</b><span class="${S.tot-S.paid?'neg':'g5'}">${S.tot-S.paid?'Осталось '+fm(S.tot-S.paid)+' ₸':'Оплачено'}</span></div>${bar(S.paid/S.tot*100)}<div class="mu" style="margin-top:6px">Оплачено ${fm(S.paid)} из ${fm(S.tot)} ₸${S.tot-S.paid?' · ближайший платёж до '+dueD():''}</div></div>`:''}
<div class="card row sp" onclick="go('coins')"><div class="row"><div class="ic">🪙</div><div><b>UniCoins</b><div class="mu">${S.coins} монет · ${S.pts} баллов</div></div></div><span style="color:var(--pr);font-weight:700">Открыть</span></div>
<h2>История</h2>${[['Стипендия','+45 000 ₸',1],['Столовая','−1 200 ₸',0],['Печать конспектов','−300 ₸',0],['Конвертация баллов','+2 🪙',1]].map(x=>`<div class="card row sp"><b>${x[0]}</b><span class="${x[2]?'g5':'neg'}">${x[1]}</span></div>`).join('')}`;
R.coins=()=>`${bk('wallet')}<h1>UniCoins</h1><div class="card hero" style="margin-top:10px"><div class="mu">Баланс</div><h1 style="font-size:38px">🪙 ${S.coins}</h1><div class="mu">${S.pts} баллов · 100 баллов = 1 UniCoin</div>${bar(S.pts%100)}</div>
<div class="card"><b>Как заработать баллы</b><div class="mu">Учёба +10 · Посещаемость +5 · Мероприятия +50 · Активность +20</div></div>
<button class="btn" onclick="if(S.pts>=100){S.pts-=100;S.coins++;toast('+1 UniCoin');draw()}else toast('Нужно 100 баллов')">Обменять 100 баллов на UniCoin</button>
<h2>Оплата по QR</h2><div class="card" style="text-align:center"><svg viewBox="0 0 21 21" width="150" shape-rendering="crispEdges"><rect width="21" height="21" fill="#fff"/>${Array.from({length:441},(_,i)=>{const x=i%21,y=i/21|0,f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);return f?(x%6==0||y%6==0||(x%6>1&&x%6<5&&y%6>1&&y%6<5)||(x>13&&(x-14)%6==0)?`<rect x="${x}" y="${y}" width="1" height="1" fill="#161a3a"/>`:''):((x*7+y*13+x*y)%3==0?`<rect x="${x}" y="${y}" width="1" height="1" fill="#161a3a"/>`:'')}).join('')}</svg><div class="mu">Покажите код в столовой</div></div>
<h2>Транзакции</h2>${[['Обед в столовой','−3 🪙'],['Вода','−1 🪙'],['Хакатон UniCode','+100 баллов']].map(x=>`<div class="card row sp"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}`;
R.access=()=>`${bk()}<h1>Smart Access</h1><div class="card" style="text-align:center;margin-top:10px"><div style="font-size:64px">🙂</div><b>${S.face?'Лицо зарегистрировано':'Лицо не зарегистрировано'}</b><div class="mu">Проход через турникет без карты</div><div style="height:10px"></div><button class="btn ${S.face?'alt':''}" onclick="S.face=!S.face;draw()">${S.face?'Удалить данные лица':'Зарегистрировать лицо'}</button></div>
<div class="card row sp"><div><b>Гостевой доступ</b><div class="mu">${S.guest?'Активен до 18:00':'Одноразовый пропуск на 1 день'}</div></div><button class="sw ${S.guest?'on':''}" onclick="S.guest=!S.guest;draw()" aria-label="Гость"></button></div>
<h2>История входов</h2>${[['08:12','Главный вход'],['12:40','Корпус Б'],['17:55','Выход']].map(x=>`<div class="card row sp"><b>${x[1]}</b><span class="mu">Сегодня ${x[0]}</span></div>`).join('')}`;
R.health=()=>`${bk()}<h1>UniHealth</h1>
<div class="card row" style="margin-top:10px"><div class="ic">👩‍⚕️</div><div><b>Серикова А. Б.</b><div class="mu">Врач-терапевт · каб. 112 · +7 727 000 00 00<br>Пн–Пт 9:00–17:00</div></div></div>
<button class="btn alt" onclick="toast('Запись на консультацию: завтра 10:00')">Записаться онлайн</button>
<button class="btn bad" style="margin-top:10px" onclick="S.sick=true;S.sickSt='new';draw()">🤒 Я заболел</button>
${S.sick?`<div class="card" style="margin-top:10px"><b>${{new:'Медработник уведомлён',called:'Врач связался с вами',done:'Назначение оформлено'}[S.sickSt]}</b><div class="mu">${{new:'Врач свяжется с вами по звонку или в чате.',called:'Идёт оценка симптомов. Следите за чатом.',done:'Рекомендации получены, справка передана в деканат.'}[S.sickSt]}</div><div style="height:8px"></div><button class="btn" onclick="toast('Чат с врачом открыт')">💬 Открыть чат</button></div>`:''}
<h2>Медицинский профиль</h2><div class="card"><div class="row sp"><b>Страховка</b><span class="g5">Активна</span></div><div class="mu">До 31.08.2027 · полис № ••••4821</div></div><div class="card row sp"><b>Документы</b><span class="mu">Справка 086, прививки</span></div>
<h2>Доступность</h2><div class="card"><div class="mu">♿ Пандусы и лифты во всех корпусах<br>🦻 Текстовый чат с врачом для студентов с нарушениями слуха<br>Услуги: консультация, справки, первая помощь</div></div>`;
R.me=()=>`<h1>Профиль</h1><div class="card row" style="margin-top:12px"><div class="ic" style="width:64px;height:64px;font-size:32px">👩‍🎓</div><div><b style="font-size:17px">Айдана Нурбекова</b><div class="mu">ИТ-21 · Университет дружбы народов имени академика А. Куатбекова</div></div></div>
<div class="card row" onclick="go('group')"><div class="ic">👥</div><div style="flex:1"><b>Группа ИТ-21</b><div class="mu">Куратор: Ержанова Г. К. · чат объявлений</div></div></div>
<div class="card"><b>Форма обучения</b><div class="mu">Демо: переключите, чтобы увидеть разницу</div><div style="margin-top:8px">${[['grant','Грант'],['paid','Платная']].map(f=>`<span class="chip ${S.tf==f[0]?'on':''}" onclick="S.tf='${f[0]}';draw()">${f[1]}</span>`).join('')}</div>${S.tf=='grant'?'<div class="mu">Оплата обучения не требуется — вы учитесь по гранту.</div>':''}</div>
<button class="btn alt" style="margin-top:4px" onclick="S.role=null;draw()">Сменить роль</button>
<h2>Настройки</h2><div class="card"><b>Язык</b><div style="margin-top:8px">${[['ru','Русский'],['kk','Қазақша'],['en','English']].map(l=>`<span class="chip ${S.lang==l[0]?'on':''}" onclick="S.lang='${l[0]}';draw()">${l[1]}</span>`).join('')}</div></div>
<div class="card row sp"><b>Тёмная тема</b><button class="sw ${document.documentElement.dataset.theme=='dark'?'on':''}" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';draw()" aria-label="Тема"></button></div>
<div class="card"><b>Уведомления</b>${['Расписание','Оценки','UniCoins','Здоровье'].map(n=>`<div class="row sp" style="margin-top:10px"><span>${n}</span><button class="sw on" onclick="this.classList.toggle('on')" aria-label="${n}"></button></div>`).join('')}</div>`;
function draw(keep){const f=document.activeElement&&document.activeElement.id=='q',pos=f?document.activeElement.selectionStart:0;
if(!S.role)S.cur='role';const PRO=S.role=='teacher'||S.role=='admin';document.body.classList.toggle('pro',PRO);$('#main').innerHTML=(PRO?LH():'')+R[S.cur]();
const tab=MAIN.find(m=>m[0]==S.cur)?S.cur:({tuition:'wallet',work:'study',group:'me',ai:'study',lect:'study',schedule:'study',video:'study',lib:'study',grades:'study',coins:'wallet'}[S.cur]||'home');
const NV=S.role=='teacher'?TN:S.role=='admin'?AN:MAIN,cu=S.role=='student'?tab:(S.cur=='ddoc'?(S.role=='teacher'?'tdoc':'adoc'):PAR[S.cur]||S.cur);$('#nav').style.display=S.role?'':'none';$('#nav').innerHTML=NV.map(m=>`<button class="${m[0]==cu?'on':''}" onclick="go('${m[0]}')"><i>${m[1]}</i>${m[2]||t(m[0])}</button>`).join('');
tl($('#app'));if(f){const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}}
draw();
</script></body></html>
